name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-build:
    name: Lint & Build Test
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Node.js環境のセットアップ (v20, キャッシュ有効)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存パッケージのクリーンインストール
        run: npm ci

      - name: ESLintによるコードチェックを実行
        run: npm run lint

      - name: Next.jsのプロダクションビルドを実行
        run: npm run build

  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Docker Buildxのセットアップ
        uses: docker/setup-buildx-action@v3

      - name: Dockerイメージのビルド検証
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false  # テストのためプッシュは無効化
          tags: nextjs-app:test
          cache-from: type=gha  # GitHub Actions用のキャッシュを利用して高速化
          cache-to: type=gha,mode=max
